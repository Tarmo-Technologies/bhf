[package]
name = "target_transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# The event stream reader is the wire-format source of truth for the
# BHF_EVENTS tag-length coverage channel (semihosting + memory-buffer probes),
# so the coverage readers reuse it rather than re-implementing decoding.
event_log = { path = "../event_log" }
# QMP (QEMU Machine Protocol) is line-delimited JSON over a socket; the
# FullSystemTransport's QMP client (HDF-4) parses it with serde_json, already a
# workspace dependency, rather than hand-rolling a JSON reader.
serde_json.workspace = true
thiserror.workspace = true
