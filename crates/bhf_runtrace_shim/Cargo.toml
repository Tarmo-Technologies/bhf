# SPDX-License-Identifier: Apache-2.0
[package]
name = "bhf_runtrace_shim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.dist]
dist = true
package-libraries = ["cdylib"]
install-libraries = ["cdylib"]
installers = ["shell"]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
include = [
    "../../INSTALL.md",
    # The documentation, laid out as in the repository so the relative links
    # in README.md, INSTALL.md and docs/ resolve inside the archive. cargo-dist
    # adds README.md, LICENSE and CHANGELOG.md itself.
    "../../RELEASE_NOTES.md",
    "../../NOTICE",
    "../../THIRD_PARTY.md",
    "../../SECURITY.md",
    "../../CONTRIBUTING.md",
    "../../CODE_OF_CONDUCT.md",
    "../../ROADMAP.md",
    "../../docs",
    "../../examples",
    "../../schemas",
    "../../benchmarks",
]

[lib]
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
runtrace_manifest = { path = "../runtrace_manifest" }

[build-dependencies]
cc.workspace = true

[dev-dependencies]
tempfile.workspace = true
