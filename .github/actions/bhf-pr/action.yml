# SPDX-License-Identifier: Apache-2.0
name: "bhf PR fuzz"
description: "Fuzz only the code changed in this pull request and annotate it inline."
branding:
  icon: "target"
  color: "purple"
inputs:
  path:
    description: "Source root to scan."
    required: false
    default: "."
  base-ref:
    description: "Git ref to diff against. Default: the PR base (merge-base) / the repo default branch."
    required: false
    default: ""
  languages:
    description: "Comma list to restrict any of the 16 lanes. Default: all found; run 'bhf auto --help' for names."
    required: false
    default: ""
  campaign-time:
    description: "Whole-run wall-clock budget in seconds."
    required: false
    default: "180"
  per-target-time:
    description: "Per-target fuzz budget in seconds."
    required: false
    default: "30"
  pr-gate:
    description: "confirmed | all | never — when to fail the check. Default: confirmed (fail only on a fuzz-confirmed finding)."
    required: false
    default: "confirmed"
  comment:
    description: "Post/update a sticky PR summary comment."
    required: false
    default: "true"
  upload-sarif:
    description: "Upload SARIF to the code-scanning tab (inline PR annotations)."
    required: false
    default: "true"
  version:
    description: "bhf release tag to install, or 'latest'."
    required: false
    default: "latest"
  build-from-source:
    description: "Install bhf from source (cargo install --git) instead of a release binary."
    required: false
    default: "false"
outputs:
  exit-code:
    description: "The bhf ci exit code (0 = pass, 1 = gate failed)."
    value: ${{ steps.run.outputs.exit }}
  ci-json:
    description: "Path to the machine-readable CI result JSON."
    value: ${{ steps.run.outputs.ci_json }}
runs:
  using: "composite"
  steps:
    - name: Resolve base ref
      id: base
      shell: bash
      run: ${{ github.action_path }}/scripts/resolve-base.sh
      env:
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        GH_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        GH_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    - name: Install bhf
      id: install
      shell: bash
      run: ${{ github.action_path }}/scripts/install-bhf.sh
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_BUILD_FROM_SOURCE: ${{ inputs.build-from-source }}
        GH_TOKEN: ${{ github.token }}

    - name: Run bhf (diff-scoped)
      id: run
      shell: bash
      run: |
        set -uo pipefail
        if ! bhf ci --help 2>/dev/null | grep -q -- '--changed-since'; then
          echo "::error title=bhf::the installed bhf does not support 'ci --changed-since' — pin 'version:' to a release that ships it, or set 'build-from-source: true'"
          exit 1
        fi
        sarif="$RUNNER_TEMP/bhf.sarif"
        ci_json="$RUNNER_TEMP/bhf-ci.json"
        lang_arg=""
        if [[ -n "${{ inputs.languages }}" ]]; then
          lang_arg="--languages ${{ inputs.languages }}"
        fi
        # The work dir lives outside the checkout so discovery never scans it.
        set +e
        bhf ci "${{ inputs.path }}" \
          --changed-since "${{ steps.base.outputs.ref }}" \
          --campaign-time "${{ inputs.campaign-time }}" \
          --per-target-time "${{ inputs.per-target-time }}" \
          $lang_arg \
          --pr-gate "${{ inputs.pr-gate }}" \
          --sarif "$sarif" \
          --ci-json "$ci_json" \
          --work-dir "$RUNNER_TEMP/bhf_work"
        code=$?
        set -e
        echo "exit=$code" >> "$GITHUB_OUTPUT"
        echo "sarif=$sarif" >> "$GITHUB_OUTPUT"
        echo "ci_json=$ci_json" >> "$GITHUB_OUTPUT"
        if [[ -f "$sarif" ]]; then echo "has_sarif=true" >> "$GITHUB_OUTPUT"; fi
        echo "bhf ci finished with exit code $code"

    # A green check that fuzzed nothing and a green check that fuzzed everything
    # clean are the same colour, which is how a job that could not build a single
    # harness went unnoticed while "passing" on other PRs. Say which one happened.
    - name: Report what was actually fuzzed
      if: ${{ always() && steps.run.outputs.exit == '0' }}
      shell: bash
      run: |
        set -uo pipefail
        run_json="$RUNNER_TEMP/bhf_work/auto/run.json"
        if [[ ! -f "$run_json" ]]; then
          echo "bhf: no changed fuzzable files in scope — nothing was fuzzed."
          echo "> **bhf**: no changed fuzzable files in scope — nothing was fuzzed." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        discovered=$(jq -r '.summary.discovered // 0' "$run_json" 2>/dev/null || echo 0)
        fuzzed=$(jq -r '.summary.built_and_fuzzed // 0' "$run_json" 2>/dev/null || echo 0)
        failed=$(jq -r '.summary.failed_build // 0' "$run_json" 2>/dev/null || echo 0)
        echo "bhf: $discovered target(s) discovered, $fuzzed built+fuzzed, $failed failed to build."
        if [[ "$discovered" -gt 0 && "$fuzzed" -eq 0 ]]; then
          echo "::warning title=bhf::this check passed without fuzzing anything — $discovered target(s) were discovered but 0 were built and fuzzed, so it provides no assurance about this diff"
        fi
        {
          echo "### bhf"
          echo ""
          echo "- discovered: \`$discovered\`  ·  built+fuzzed: \`$fuzzed\`  ·  failed build: \`$failed\`"
          if [[ "$discovered" -gt 0 && "$fuzzed" -eq 0 ]]; then
            echo "- :warning: passed **without fuzzing anything** — this check provides no assurance about this diff."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    # A tool/setup failure writes no ci-json, so without this the log carries the
    # outcome ("3 failed build") but none of the evidence explaining it — which is
    # why the 2026-09-14 runner failures could not be root-caused from CI alone.
    # The work dir holds the dependency manifest, per-target reasons, and bug
    # report; surface the small ones inline and keep the rest as an artifact.
    - name: Diagnose a failed run
      if: ${{ always() && steps.run.outputs.exit != '' && steps.run.outputs.exit != '0' }}
      shell: bash
      run: |
        set -uo pipefail
        work="$RUNNER_TEMP/bhf_work"
        # Disk first: two full builds of a large Rust workspace (the source
        # install, then the harness build) is the leading explanation for a
        # cargo failure that does not reproduce on a developer host, and an
        # exhausted filesystem surfaces as an opaque "cargo build failed".
        echo "::group::disk and build-tree sizes"
        df -h / "$RUNNER_TEMP" 2>/dev/null || true
        du -sh "$GITHUB_WORKSPACE/target" "${CARGO_HOME:-$HOME/.cargo}" "$work" 2>/dev/null || true
        echo "::endgroup::"
        echo "::group::bhf work dir"
        ls -R "$work/auto" 2>/dev/null | head -50 || echo "(no work dir at $work)"
        echo "::endgroup::"
        if [[ -s "$work/auto/missing-deps.txt" ]]; then
          echo "::group::missing-deps.txt (external dependencies bhf could not satisfy)"
          cat "$work/auto/missing-deps.txt"
          echo "::endgroup::"
        fi
        if [[ -f "$work/auto/run.json" ]]; then
          echo "::group::campaign summary"
          jq -r '.summary // {} | to_entries[] | "\(.key): \(.value)"' "$work/auto/run.json" 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::per-target outcome and reason"
          jq -r '.targets // [] | .[] | "\(.harness_id // "?")  \(.name // "?")  \(.outcome.outcome // .outcome // "?")  \(.outcome.reason // "")"' \
            "$work/auto/run.json" 2>/dev/null | head -50 || true
          echo "::endgroup::"
        fi
        # bhf persists the raw cargo stderr next to each harness when a Rust
        # build fails. That output is the only evidence distinguishing a compile
        # error from a process that was killed, so print it before anything else
        # that might be truncated.
        shopt -s nullglob
        for log in "$work"/harnesses/*/cargo-build-stderr.log; do
          echo "::group::cargo stderr — $(basename "$(dirname "$log")")"
          tail -60 "$log"
          echo "::endgroup::"
        done
        shopt -u nullglob
        if [[ -s "$work/auto/bug-report.md" ]]; then
          echo "::group::bug-report.md (cases bhf could not fully handle)"
          head -80 "$work/auto/bug-report.md"
          echo "::endgroup::"
        fi

    - name: Upload bhf work dir
      if: ${{ always() && steps.run.outputs.exit != '' && steps.run.outputs.exit != '0' }}
      # Never let the diagnostics change the job's verdict. Artifact finalization
      # on this repo's plan returns a non-retryable 403 often enough to have failed
      # an otherwise-passing Windows job, and a failed upload of evidence about a
      # failure must not become a second, more confusing failure. The inline dump
      # above is the primary channel; this is the convenience copy.
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: bhf-work-${{ github.run_id }}-${{ github.run_attempt }}
        # `auto/` holds the manifests and campaign report; the per-harness cargo
        # stderr and result.json live under `harnesses/` and are the evidence for
        # a build failure. Everything else there (binaries, corpora) is excluded.
        path: |
          ${{ runner.temp }}/bhf_work/auto
          ${{ runner.temp }}/bhf_work/harnesses/*/cargo-build-stderr.log
          ${{ runner.temp }}/bhf_work/harnesses/*/result.json
        if-no-files-found: ignore
        retention-days: 7

    - name: Upload SARIF (code-scanning annotations)
      if: ${{ inputs.upload-sarif == 'true' && steps.run.outputs.has_sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.run.outputs.sarif }}
        category: bhf

    - name: PR summary comment
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      with:
        script: |
          const script = require(`${process.env.GITHUB_ACTION_PATH}/scripts/comment.js`);
          await script({ github, context, core, ciJsonPath: process.env.CI_JSON_PATH });
      env:
        CI_JSON_PATH: ${{ steps.run.outputs.ci_json }}

    - name: Enforce gate
      if: ${{ steps.run.outputs.exit != '' && steps.run.outputs.exit != '0' }}
      shell: bash
      run: |
        if [[ -f "${{ steps.run.outputs.ci_json }}" ]]; then
          echo "::error title=bhf::gate failed (exit ${{ steps.run.outputs.exit }}) — a fuzz-confirmed finding was introduced in this PR's changed code."
        else
          echo "::error title=bhf::bhf ci errored (exit ${{ steps.run.outputs.exit }}) before producing a result — see the 'Run bhf' step log; this is a tool/setup failure, not a finding."
        fi
        exit 1
