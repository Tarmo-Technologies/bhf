# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  push:
    branches: [main, rtos-radar-fuzzing]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      force_full:
        description: Require every CI lane, even for documentation-only changes
        type: boolean
        default: false
    outputs:
      decision:
        description: Acceptance decision from this run
        value: ${{ jobs.ci-acceptance.outputs.decision }}
      commit:
        description: Exact evaluated commit
        value: ${{ jobs.ci-acceptance.outputs.commit }}
      run_id:
        description: Workflow run that produced the result
        value: ${{ jobs.ci-acceptance.outputs.run_id }}
      run_attempt:
        description: Workflow attempt that produced the result
        value: ${{ jobs.ci-acceptance.outputs.run_attempt }}


permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/classify-ci-scope.yml
    with:
      force_full: ${{ inputs.force_full || false }}

  ci-policy:
    name: CI policy regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install schema validator
        # ubuntu-24.04 system Python is externally managed (PEP 668); --user keeps it out of /usr.
        run: python3 -m pip install --user --break-system-packages "jsonschema==4.25.1"
      - name: Test fail-closed CI policy and path classification
        run: python3 -m unittest discover -s scripts/ci/tests -v
      - name: Check that every download retries and is checked
        run: bash scripts/ci/check-network-fetches.sh

  minimum-rust:
    name: Rust 1.88 source compatibility
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0

      - name: Check all workspace targets at the declared minimum
        run: cargo +1.88.0 check --locked --workspace --all-targets

  build-test:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.99.0
          components: clippy

      # The crates the lockfile names, downloaded once rather than on every run.
      - name: Cache the cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: build-test-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: build-test-cargo-

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Test VS Code extension
        run: |
          npm ci --prefix editors/vscode
          npm test --prefix editors/vscode

      - name: Test GNAT Studio plugin helpers
        run: python3 -m unittest discover -s editors/gnatstudio/tests

      - name: Test container validation contracts
        run: python3 -m unittest discover -s docker -p 'test_*.py'

      - name: Test offline signature verifier
        run: python3 -m unittest discover -s scripts/tests -p 'test_offline_verifier.py' -v

      - name: Test the campaign sweep scripts
        run: python3 -m unittest discover -s benchmarks/campaign-2026-07-25 -p 'test_*.py' -v

      - name: Test the engine-comparison scripts
        run: python3 -m unittest discover -s benchmarks/engine-comparison -p 'test_*.py' -v

      - name: Build workspace
        run: cargo build --locked --workspace

      - name: Require default production dependency graphs to exclude LLM
        run: |
          if cargo tree --locked -p bhf -p bhf-daemon --edges normal --prefix none \
            | grep -q '^llm_harness_gen '; then
            echo 'default CLI/daemon dependency graph contains llm_harness_gen' >&2
            exit 1
          fi

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets

      - name: Test scheduler runtime reliability
        run: cargo test --locked -p continuous_daemon --lib

      - name: Install cargo-nextest
        run: bash scripts/ci/install-nextest.sh

      # The smoke subset's Ada representative (auto_ada_access_lifecycle)
      # builds and fuzzes an Ada target; without GNAT it skips as a pass.
      - name: Install GNAT for the Ada smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnat gprbuild
          gnatmake --version | head -1
          gprbuild --version | head -1

      # nextest runs all tests across every binary in one global parallel pool.
      # `cargo test` runs the ~290 test binaries one at a time, which took the
      # slow integration suites past the job timeout (58min+). nextest brings the
      # same suite to well under 10min. Doctests (which nextest does not run) are
      # covered by the dedicated `--doc` step below.
      # Per-PR gate = the ~5700 fast unit/light tests PLUS a small smoke subset of
      # the heavy build+fuzz integration tests (one representative per language +
      # build-recovery + the runtime-oracle capability path) PLUS the release and
      # docs contract tests (m19_*, offline_dist_scripts, release_bundle_manifest
      # and the guide checks), which take seconds; doc-contracts runs those for a
      # documentation-only change. The FULL heavy suite
      # (~110 build+fuzz tests, ~40min) runs in integration-nightly.yml — running
      # all of it on every PR is what pushed this job past its timeout.
      # RAYON_NUM_THREADS=1 + the heavy-bhf concurrency cap (.config/nextest.toml)
      # keep the smoke tests from oversubscribing; --no-fail-fast matches
      # `cargo test` (nextest is fail-fast by default). The `ci` profile
      # retries a failure once (a pass then is FLAKY), kills a test that runs
      # past 16 minutes, and writes a JUnit report with every test's output.
      - name: Test workspace (nextest — fast tests + integration smoke)
        env:
          RAYON_NUM_THREADS: "1"
        run: cargo nextest run --locked --workspace --no-fail-fast --profile ci -E 'not (package(bhf) & kind(test)) | binary(=project_build_consent) | binary(=auto_c_common_cli) | binary(=auto_ada_access_lifecycle) | binary(=capability_cli) | binary(=collector_mock) | binary(=extension_cli) | (binary(=auto_cpp_amalgamation) & test(=cpp_amalgamation_detects_planted_bug_with_nonempty_testcase)) | (binary(=auto_go_force) & test(=forced_go_targets_build_fuzz_and_are_marked_forced)) | (binary(=auto_rust_discovery) & test(=rust_target_builds_and_fuzzes_natively_and_finds_planted_crash)) | binary(/^m19_/) | binary(=offline_dist_scripts) | binary(=release_bundle_manifest) | (binary(=custom_harness_flow) & test(/::the_guides_do_not_repeat_retired_claims$|::the_sanitizer_guide_says_which_emulated_children_name_each_key_once$/))'

      # #57 AC: the out-of-tree extension fixture must also be exercised by a
      # RELEASE-build integration test — the debug nextest above only covers it in
      # the dev profile. Scoped to the extension end-to-end only (the `extension_cli`
      # CLI round-trip plus the `extension_host` subprocess tests that drive the
      # dependency-free Python reference extension), never the whole suite.
      - name: Test extension e2e (release build)
        env:
          RAYON_NUM_THREADS: "1"
        run: cargo nextest run --locked --release --no-fail-fast --profile ci-release -E 'binary(=extension_cli) | (package(extension_host) & kind(test))'

      - name: Test doctests
        run: cargo test --locked --workspace --doc

      # `cargo build/test --workspace` compiles default features only, so every
      # `#[cfg(feature = ...)]` block is invisible to the steps above. That
      # matters most for `libafl-engine`: its crates are `optional = true`, so
      # they are not even fetched, and a dependency bump that breaks the
      # bindings would merge on a fully green CI run. Dependabot proposed
      # exactly that (libafl 0.13 -> 0.16, four compile errors behind the flag).
      - name: Build and test optional features
        env:
          # probe_gnat_actions' build script rejects the `enabled` feature
          # outside these profiles, by design.
          BHF_PROFILE: external-tools
        run: |
          cargo build --locked -p fuzz_engine_libafl_adapter --features libafl-engine
          cargo test --locked -p fuzz_engine_libafl_adapter --features libafl-engine
          cargo test --locked -p bhf --features libafl-engine --test fuzz_libafl_engine
          cargo test --locked -p probe_gnat_actions --features enabled
          cargo check --locked -p bhf -p bhf-daemon --features bhf/llm,bhf-daemon/llm
          cargo test --locked -p bhf-daemon --features llm --lib
          cargo test --locked -p bhf --features llm --lib llm::

      - name: Summarize the nextest reports
        if: ${{ always() }}
        run: python3 scripts/ci/junit-summary.py --title "build-test" target/nextest/ci/junit.xml target/nextest/ci-release/junit.xml

      - name: Retain the nextest reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-build-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/nextest/*/junit.xml
          if-no-files-found: warn
          retention-days: 14

  # The release and docs contract tests read README.md, INSTALL.md and
  # docs/site/*.md, which a documentation-only change can break. build-test
  # runs them with everything else; this lane runs them when the classifier
  # skipped the heavy jobs, and CI acceptance requires it to pass then.
  # Native ARM64: the workspace (the runtrace shim included) builds, every
  # test outside bhf's heavy integration suites passes, and `bhf auto` builds
  # a C target and finds the stack overflow planted in it, and with HWASan a
  # heap overflow, on an ARM64 runner.
  arm64-build:
    name: ARM64 build, tests and auto smoke
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.99.0

      - name: Cache the cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: arm64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: arm64-cargo-

      # clang builds the harnesses; the ARM64 runtrace shim links with lld.
      - name: Install clang, lld and make
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm make
          clang --version | head -1

      - name: Build the workspace and the runtrace shim
        run: cargo build --locked --workspace

      - name: Install cargo-nextest
        run: bash scripts/ci/install-nextest.sh

      - name: Test the workspace (all but bhf's heavy integration suites)
        env:
          RAYON_NUM_THREADS: "1"
        run: cargo nextest run --locked --workspace --no-fail-fast --profile ci -E 'not (package(bhf) & kind(test))'

      - name: Find a planted bug with bhf auto
        run: bash scripts/ci/arm64-auto-smoke.sh target/debug/bhf

      # `--sanitizers hwasan` builds the fuzzed harness with HWAddressSanitizer,
      # which only an AArch64 host runs, and finds the heap overflow planted in
      # the test's target. BHF_REQUIRE_TOOLS=1 fails the test if clang cannot
      # build and run a HWASan program here, instead of skipping it.
      - name: Find a heap overflow with HWASan
        env:
          RAYON_NUM_THREADS: "1"
          BHF_REQUIRE_TOOLS: "1"
        run: cargo nextest run --locked -p bhf --test auto_hwasan --no-fail-fast --profile ci

  macos-build:
    name: macOS build, shim gating and auto smoke
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.99.0

      - name: Cache the cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: macos-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-cargo-

      # A native aarch64-apple-darwin build. The runtrace shim is an LD_PRELOAD
      # library built for Linux only: its crate builds an empty library here,
      # and no shim lands beside bhf. Xcode's clang builds the harnesses.
      - name: Build the workspace for aarch64-apple-darwin
        run: |
          uname -sm
          clang --version | head -1
          cargo build --locked --workspace
          file target/debug/bhf | grep 'Mach-O 64-bit executable arm64'

      # The shared-map readers' tests, without the one that builds harnesses
      # with gcc, which on macOS is Apple's clang.
      - name: Test the shim gating and the shared coverage maps
        env:
          RAYON_NUM_THREADS: "1"
        run: >-
          cargo test --locked -p bhf --lib --
          auto::shim_path:: fuzz::coverage_tracker_tests:: fuzz::redqueen_cmplog_tests::
          auto::report::tests::a_target_fuzzed_without_a_built_shim
          --skip fuzz::redqueen_cmplog_tests::coverage_source_names_the_instrumentation

      - name: Find a planted bug with bhf auto, without the runtrace shim
        run: bash scripts/ci/macos-auto-smoke.sh target/debug/bhf

  doc-contracts:
    name: Release and docs contract tests
    needs: changes
    if: needs.changes.outputs.heavy == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.99.0

      - name: Install cargo-nextest
        run: bash scripts/ci/install-nextest.sh

      # cli_md_common_flow runs cli.md's Ada pipeline as written; without
      # GNAT it skips as a pass.
      - name: Install GNAT for the Ada common-flow contract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnat gprbuild
          gnatmake --version | head -1
          gprbuild --version | head -1

      - name: Test the release and docs contracts
        env:
          RAYON_NUM_THREADS: "1"
        # Builds only the contract binaries (and the library tests of bhf,
        # bhf-daemon and lang_profile), not every bhf integration test.
        # scripts/ci/tests/test_doc_contracts.py finds every test that reads
        # a documentation page (license_audit_subcommand_exits_zero_for_current_repo
        # reads THIRD_PARTY.md through license_policy) and fails when this
        # filter misses one.
        run: cargo nextest run --locked -p bhf -p bhf-daemon -p lang_profile --lib --test 'm19_*' --test offline_dist_scripts --test release_bundle_manifest --test custom_harness_flow --test auto_exit_codes_docs --test cli_md_common_flow --test collector_help --test command_help_cli --test fuzz_grammar_help --no-fail-fast --profile ci -E 'binary(/^m19_/) | binary(=offline_dist_scripts) | binary(=release_bundle_manifest) | binary(=auto_exit_codes_docs) | binary(=cli_md_common_flow) | binary(=collector_help) | binary(=command_help_cli) | binary(=fuzz_grammar_help) | (binary(=custom_harness_flow) & test(/::the_guides_do_not_repeat_retired_claims$|::the_sanitizer_guide_says_which_emulated_children_name_each_key_once$/)) | (kind(lib) & test(/::the_docs_list_every_config_key$|::the_docs_list_only_config_keys_that_exist$|::the_config_help_lists_every_config_key$|::the_help_and_docs_list_every_cross_lane$|::auto_md_lists_every_default_skip$|::vulnerability_coverage_names_the_lanes_with_and_without_sink_oracles$|::the_shipped_board_profile_template_loads$|::the_daemon_docs_list_the_tools_tools_list_advertises$|::the_readme_names_the_report_only_dialects$|::license_audit_subcommand_exits_zero_for_current_repo$/))'

      - name: Summarize the nextest report
        if: ${{ always() }}
        run: python3 scripts/ci/junit-summary.py --title "doc-contracts" target/nextest/ci/junit.xml

      - name: Retain the nextest report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-doc-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/nextest/*/junit.xml
          if-no-files-found: warn
          retention-days: 14

  container-core:
    name: Core container build and run
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Image blockers (a CVE published upstream since the change, as often as
    # not) only annotate pull request and branch push runs; a release caller
    # (force_full) or a tag run fails on them. See review-image-scan.py.
    env:
      BHF_IMAGE_SCAN_MODE: ${{ (inputs.force_full || github.ref_type == 'tag') && 'enforce' || 'auto' }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and exercise the optional C/C++ Docker target
        run: bash scripts/ci/container-core-acceptance.sh
      - name: Check the selected Ada toolchain flavor
        run: bash scripts/ci/container-ada-acceptance.sh
      - name: Retain container acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            container-acceptance/
            container-ada-acceptance/
          if-no-files-found: error
          retention-days: 7

  container-full:
    name: Default all-language container acceptance
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Image blockers (a CVE published upstream since the change, as often as
    # not) only annotate pull request and branch push runs; a release caller
    # (force_full) or a tag run fails on them. See review-image-scan.py.
    env:
      BHF_IMAGE_SCAN_MODE: ${{ (inputs.force_full || github.ref_type == 'tag') && 'enforce' || 'auto' }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and exercise the default all-language Dockerfile
        run: bash scripts/ci/container-full-acceptance.sh
      - name: Retain full-language container evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: container-full-acceptance/
          if-no-files-found: error
          retention-days: 7

  rhel7-build:
    name: RHEL 7 compatible build
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RHEL7_BUILD_IMAGE: quay.io/pypa/manylinux2014_x86_64@sha256:0d25b049964b2549b83384036abdff06789a8c0b1e9ff003ec80f0d531f79e50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pinned rustup-init and dist tarball the container fetches.
      - name: Cache the pinned downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/fetch-cache
          key: bhf-fetch-${{ hashFiles('scripts/ci/install-*.sh') }}

      - name: Build and test on the RHEL 7 ABI
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/io" \
            --workdir /io \
            --env BHF_FETCH_CACHE=/io/target/fetch-cache \
            --env CARGO_HOME=/tmp/cargo \
            --env RUSTUP_HOME=/tmp/rustup \
            --env CARGO_TARGET_DIR=/io/target/rhel7 \
            "$RHEL7_BUILD_IMAGE" \
            bash -lc '
              set -euo pipefail
              # The runner checkout is owned by the host user, while this
              # disposable container runs as root. Trust this mount only.
              git config --global --add safe.directory /io
              export BHF_RELEASE_VERSION=1
              BHF_VCS_REF="$(git rev-parse HEAD)"
              export BHF_VCS_REF
              bash scripts/ci/install-rustup.sh -y --profile minimal
              export PATH="$CARGO_HOME/bin:$PATH"
              test -x /opt/python/cp312-cp312/bin/python3
              export PATH="/opt/python/cp312-cp312/bin:$PATH"
              python3 --version
              bash scripts/ci/build-test-openssl.sh /tmp/bhf-ci-openssl
              export PATH="/tmp/bhf-ci-openssl/bin:$PATH"
              openssl version
              cargo test --locked -p continuous_daemon --lib
              cargo test --locked -p governance --lib
              cargo test --locked -p bhf --test offline_dist_scripts -- --nocapture
              cargo build --locked --release --workspace
              scripts/check-linux-release-abi.sh "$CARGO_TARGET_DIR/release"
              bash scripts/ci/install-cargo-dist.sh
              dist build --artifacts=local --target=x86_64-unknown-linux-gnu --output-format=json > /io/target/component-local-manifest.json
              dist build --artifacts=global --output-format=json > /io/target/component-global-manifest.json
              artifact_dir="$CARGO_TARGET_DIR/distrib"
              python3 scripts/augment-release-installer.py "$artifact_dir/bhf-installer.sh"
              python3 scripts/fix-dist-shell-installer.py "$artifact_dir/bhf-installer.sh" "$artifact_dir/bhf-daemon-installer.sh" "$artifact_dir/bhf_runtrace_shim-installer.sh" "$artifact_dir/bhf_cc_intercept-installer.sh"
              python3 scripts/fix-dist-library-installer.py "$artifact_dir/bhf_runtrace_shim-installer.sh" "$artifact_dir/bhf_cc_intercept-installer.sh"
              python3 scripts/ci/component-install-smoke.py --artifacts "$artifact_dir" --evidence /io/target/component-install-linux
              tar -C "$CARGO_TARGET_DIR/release" -czf /io/target/bhf-el7-release.tar.gz \
                bhf \
                bhf-daemon \
                libbhf_runtrace_shim.so \
                libbhf_cc_intercept.so
            '

      - name: Upload EL7-baseline release binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bhf-el7-release
          path: target/bhf-el7-release.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Retain Linux component installer evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: component-install-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/component-install-linux/
          if-no-files-found: error
          retention-days: 7

  rhel-family-smoke:
    name: ${{ matrix.name }} release compatibility
    needs: rhel7-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: RHEL 8.10 compatible
            image: almalinux:8.10@sha256:f043b7ac550015e1ed0b5a55a420c61d178bff4357ab9663fe0fbdcf1e6e2d86
          - name: RHEL 9.8 compatible
            image: almalinux:9.8@sha256:28db580abb508f7ccbc0ac6d53e1d8da9d42a26c77fa3dcc26ac2726673fbe3e
          - name: RHEL 10.2 compatible
            image: almalinux:10.2@sha256:689dc4a86e288b3f88ced4bf14bef18cdaf5539609608ca4cebc62720740dfa2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download EL7-baseline release binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bhf-el7-release
          path: target/platform-release

      - name: Exercise release on ${{ matrix.name }}
        env:
          PLATFORM_IMAGE: ${{ matrix.image }}
        run: |
          tar -C target/platform-release -xzf target/platform-release/bhf-el7-release.tar.gz
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/io:ro" \
            --volume "$GITHUB_WORKSPACE/target/platform-release:/opt/bhf:ro" \
            "$PLATFORM_IMAGE" \
            bash -lc '
              set -euo pipefail
              cat /etc/redhat-release
              dnf -y install clang llvm make
              for artifact in \
                /opt/bhf/bhf \
                /opt/bhf/bhf-daemon \
                /opt/bhf/libbhf_runtrace_shim.so \
                /opt/bhf/libbhf_cc_intercept.so; do
                ldd "$artifact"
              done | tee /tmp/bhf-ldd.txt
              if grep -q "not found" /tmp/bhf-ldd.txt; then exit 1; fi
              /opt/bhf/bhf --version
              /opt/bhf/bhf-daemon --help >/dev/null
              /opt/bhf/bhf scan /io/tests/fixtures/engine_parity/magic_byte \
                --work-dir /tmp/bhf-scan
              /opt/bhf/bhf auto /io/tests/fixtures/engine_parity/magic_byte \
                --work-dir /tmp/bhf-plan \
                --languages c --list-targets --no-discovery-cache
              /opt/bhf/bhf auto /io/tests/fixtures/engine_parity/magic_byte \
                --work-dir /tmp/bhf-fuzz \
                --languages c --target parse_frame --iterations 32 --single-pass \
                --sanitizers none --per-target-time 5 --no-discovery-cache
              grep -Eq "\"built_and_fuzzed\"[[:space:]]*:[[:space:]]*1" \
                /tmp/bhf-fuzz/auto/run.json
              test -n "$(find /tmp/bhf-fuzz -name runtrace.jsonl -type f -size +0c -print -quit)"
            '

  ubuntu-release-smoke:
    name: Ubuntu ${{ matrix.version }} release compatibility
    needs: rhel7-build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "22.04 LTS"
            runner: ubuntu-22.04
          - version: "24.04 LTS"
            runner: ubuntu-24.04
          - version: "26.04 LTS"
            runner: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download EL7-baseline release binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bhf-el7-release
          path: target/platform-release

      - name: Exercise release on Ubuntu ${{ matrix.version }}
        run: |
          tar -C target/platform-release -xzf target/platform-release/bhf-el7-release.tar.gz
          lsb_release -ds
          clang --version
          for artifact in \
            target/platform-release/bhf \
            target/platform-release/bhf-daemon \
            target/platform-release/libbhf_runtrace_shim.so \
            target/platform-release/libbhf_cc_intercept.so; do
            ldd "$artifact"
          done | tee target/platform-release/ldd.txt
          if grep -q "not found" target/platform-release/ldd.txt; then exit 1; fi
          target/platform-release/bhf --version
          target/platform-release/bhf-daemon --help >/dev/null
          target/platform-release/bhf scan tests/fixtures/engine_parity/magic_byte \
            --work-dir "$RUNNER_TEMP/bhf-scan"
          target/platform-release/bhf auto tests/fixtures/engine_parity/magic_byte \
            --work-dir "$RUNNER_TEMP/bhf-plan" \
            --languages c --list-targets --no-discovery-cache
          target/platform-release/bhf auto tests/fixtures/engine_parity/magic_byte \
            --work-dir "$RUNNER_TEMP/bhf-fuzz" \
            --languages c --target parse_frame --iterations 32 --single-pass \
            --sanitizers none --per-target-time 5 --no-discovery-cache
          grep -Eq '"built_and_fuzzed"[[:space:]]*:[[:space:]]*1' \
            "$RUNNER_TEMP/bhf-fuzz/auto/run.json"
          test -n "$(find "$RUNNER_TEMP/bhf-fuzz" -name runtrace.jsonl -type f -size +0c -print -quit)"

  # The release dry run for Linux ARM64, as rhel7-build is for x86_64: dist
  # builds the aarch64 component archives and installers in the pinned
  # manylinux2014_aarch64 image the release job uses (glibc 2.17), installs
  # them through the generated installers, and the archives are unpacked and
  # smoke-tested on the ARM64 runner.
  arm64-release-build:
    name: ARM64 release archives and smoke
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      RHEL7_BUILD_IMAGE: quay.io/pypa/manylinux2014_aarch64@sha256:ae34a6ceeefe0b535c525b2e96f297311c8f1e01cfd8b9be5f647eece5b5c60b
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pinned rustup-init and dist tarball the container fetches.
      - name: Cache the pinned downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/fetch-cache
          key: bhf-fetch-arm64-${{ hashFiles('scripts/ci/install-*.sh') }}

      - name: Build the aarch64 release archives on the RHEL 7 ABI
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/io" \
            --workdir /io \
            --env BHF_FETCH_CACHE=/io/target/fetch-cache \
            --env CARGO_HOME=/tmp/cargo \
            --env RUSTUP_HOME=/tmp/rustup \
            --env CARGO_TARGET_DIR=/io/target/rhel7 \
            "$RHEL7_BUILD_IMAGE" \
            bash -lc '
              set -euo pipefail
              # The runner checkout is owned by the host user, while this
              # disposable container runs as root. Trust this mount only.
              git config --global --add safe.directory /io
              export BHF_RELEASE_VERSION=1
              BHF_VCS_REF="$(git rev-parse HEAD)"
              export BHF_VCS_REF
              bash scripts/ci/install-rustup.sh -y --profile minimal
              export PATH="$CARGO_HOME/bin:$PATH"
              test -x /opt/python/cp312-cp312/bin/python3
              export PATH="/opt/python/cp312-cp312/bin:$PATH"
              # The runtrace shim links with rust-lld, as in the release job.
              PATH="$(rustc --print sysroot)/lib/rustlib/aarch64-unknown-linux-gnu/bin/gcc-ld:$PATH"
              command -v ld.lld
              bash scripts/ci/install-cargo-dist.sh
              dist build --artifacts=local --target=aarch64-unknown-linux-gnu --output-format=json > /io/target/component-local-manifest.json
              release_dir="$CARGO_TARGET_DIR/aarch64-unknown-linux-gnu/dist"
              [[ -d $release_dir ]] || release_dir="$CARGO_TARGET_DIR/dist"
              scripts/check-linux-release-abi.sh "$release_dir"
              dist build --artifacts=global --output-format=json > /io/target/component-global-manifest.json
              artifact_dir="$CARGO_TARGET_DIR/distrib"
              python3 scripts/augment-release-installer.py "$artifact_dir/bhf-installer.sh"
              python3 scripts/fix-dist-shell-installer.py "$artifact_dir/bhf-installer.sh" "$artifact_dir/bhf-daemon-installer.sh" "$artifact_dir/bhf_runtrace_shim-installer.sh" "$artifact_dir/bhf_cc_intercept-installer.sh"
              python3 scripts/fix-dist-library-installer.py "$artifact_dir/bhf_runtrace_shim-installer.sh" "$artifact_dir/bhf_cc_intercept-installer.sh"
              python3 scripts/ci/component-install-smoke.py --artifacts "$artifact_dir" --evidence /io/target/component-install-linux-arm64
            '

      # clang and make build the smoke's C harness.
      - name: Install clang and make
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm make

      - name: Smoke-test the aarch64 archives on the ARM64 runner
        run: bash scripts/ci/linux-archive-smoke.sh target/rhel7/distrib aarch64-unknown-linux-gnu

      - name: Retain ARM64 component installer evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: component-install-linux-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/component-install-linux-arm64/
          if-no-files-found: error
          retention-days: 7

  windows-build:
    name: Windows MSVC build and tests
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: windows-2022
    # The full unit-test suite, clippy and the Windows integration suites run
    # before the release build.
    timeout-minutes: 120
    env:
      BHF_RELEASE_VERSION: "1"
      BHF_VCS_REF: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.99.0

      # Every crate's unit tests, the daemon's included: a test that only
      # holds on Unix is cfg-gated in the source, so nothing is filtered here.
      # The runner's worker starts steps at BelowNormal priority
      # (actions/runner-images#7663); the step raises itself to Normal, the
      # class a user's shell runs at, which the background re-run priority
      # test then checks bhf's re-runs against.
      - name: Test the workspace libraries and the daemon
        shell: pwsh
        run: |
          [System.Diagnostics.Process]::GetCurrentProcess().PriorityClass = 'Normal'
          cargo test --locked --workspace --lib --no-fail-fast
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Clippy
        shell: pwsh
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The end-to-end tests build harnesses with clang (on the image) and GNU
      # make, which the image lacks; without make on PATH they skip.
      - name: Install GNU make
        shell: pwsh
        run: |
          choco install make --version=4.4.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # harness_gen's standalone-driver unit tests build a harness with make
      # too, so they skipped in the library step above: run them with it.
      - name: Test the standalone harness drivers
        shell: pwsh
        run: |
          cargo test --locked -p harness_gen --lib standalone
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The interpreted lanes on native Windows (#305-#307): each runs from the
      # launch spec beside its POSIX launcher. The image's Python and .NET SDK
      # serve; a JDK, Node and SharpFuzz are installed here, before the
      # integration suites, whose capsule round trips build these lanes too
      # and should see the toolchains the lanes' own tests use.
      - name: Install a JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install SharpFuzz
        shell: pwsh
        run: |
          dotnet tool install --global --version 2.3.0 SharpFuzz.CommandLine
          # The C# harness restores only from NuGet's global packages folder.
          dotnet new classlib --output "$env:RUNNER_TEMP\sharpfuzz-stage" --force
          dotnet add "$env:RUNNER_TEMP\sharpfuzz-stage" package SharpFuzz --version 2.3.0

      # Perl, Ruby, Lua and PHP on native Windows (#325): the runner's
      # Strawberry Perl serves; Ruby and PHP come from Chocolatey when the image
      # has none, and Lua 5.4 is built from lua.org's source (the packaged
      # Windows builds are 5.1).
      - name: Install Ruby, PHP and Lua
        shell: pwsh
        run: |
          foreach ($tool in 'ruby', 'php') {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              choco install $tool --yes --no-progress
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $dir = Get-ChildItem C:\tools -Directory -Filter "$tool*" | Sort-Object Name -Descending | Select-Object -First 1
              $bin = if ($tool -eq 'ruby') { Join-Path $dir.FullName 'bin' } else { $dir.FullName }
              Add-Content $env:GITHUB_PATH $bin
            }
          }
          $lua = & scripts\ci\install-lua-windows.ps1 -Dest "$env:RUNNER_TEMP\lua54"
          Add-Content $env:GITHUB_PATH $lua

      # The Rust lane builds its harness with a nightly (#326). It is installed
      # before the integration suites, whose Rust capsule round trips build
      # the lane too: a `cargo +nightly` there would otherwise make rustup
      # install it while a test beside it reads the half-installed toolchain.
      - name: Install a nightly Rust
        run: rustup toolchain install nightly --profile minimal

      # The integration suites of the native Windows paths: the clang and
      # MSVC harness lanes, Visual Studio import, quoted build inputs, spaced
      # paths, capsules, explain, cartography and provenance, plus every
      # integration test of the other crates. A test that only holds on Unix
      # is cfg-gated in the source. bhf's other integration suites run on
      # Linux (build-test's smoke subset per change, all of them nightly);
      # build_recovery builds a release bhf of its own and stays off this job.
      # winafl_engine's end-to-end WinAFL campaigns need WinAFL and DynamoRIO,
      # which this runner does not install: they are #[ignore]d (and listed as
      # ignored), so here it runs the refusal that names them and the x86
      # smoke (--vs-arch x86, builtin engine); the nightly's WinAFL job runs
      # the campaigns with --ignored against a pinned build.
      - name: Test the Windows integration suites
        shell: pwsh
        run: |
          cargo test --locked --workspace --exclude bhf --test '*' --no-fail-fast
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p bhf --no-fail-fast --test auto_msbuild_import --test auto_force_win32 --test auto_makefile_injection --test auto_spaced_paths --test auto_force_params --test auto_peripheral_sequence --test capsule_cli --test capsule_lanes_cli --test cartography_cli --test explain_cli --test provenance_cli --test winafl_engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # BHF_REQUIRE_TOOLS=1 fails a test whose toolchain is missing instead of
      # skipping it.
      - name: Test the interpreted lanes
        shell: pwsh
        env:
          BHF_REQUIRE_TOOLS: "1"
        run: |
          cargo test --locked -p bhf --no-fail-fast --test auto_python_lane --test auto_java_fuzz --test auto_java_file_param --test auto_java_builder --test auto_js_browser_globals --test auto_csharp_source_lines --test auto_perl_lane --test auto_ruby_lane --test auto_lua_lane --test auto_php_lane
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The Rust and Fortran lanes on native Windows (#326, #327): the Rust
      # harness builds with a nightly for x86_64-pc-windows-msvc, the Fortran
      # harness with MinGW-w64's gfortran and gcc (the runner's C:\mingw64,
      # else Strawberry Perl's), without sanitizers.
      - name: Test the Rust and Fortran lanes
        shell: pwsh
        env:
          BHF_REQUIRE_TOOLS: "1"
        run: |
          if (-not (Get-Command gfortran -ErrorAction SilentlyContinue)) {
            $dir = 'C:\mingw64\bin', 'C:\Strawberry\c\bin' | Where-Object { Test-Path (Join-Path $_ 'gfortran.exe') } | Select-Object -First 1
            if (-not $dir) { Write-Error 'no MinGW-w64 gfortran on the runner'; exit 1 }
            $env:PATH = "$env:PATH;$dir"
          }
          cargo test --locked -p bhf --no-fail-fast --test auto_rust_discovery --test auto_fortran_lane
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The COBOL lane on native Windows (#430): GnuCOBOL's MinGW build from
      # Chocolatey. Its cobc on PATH is a shim; bhf finds GnuCOBOL's bin, and
      # the gcc there, through COB_CONFIG_DIR, which the install sets only
      # for later shells.
      - name: Test the COBOL lane
        shell: pwsh
        env:
          BHF_REQUIRE_TOOLS: "1"
        run: |
          choco install gnucobol --version=3.2.0.20240515 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:COB_CONFIG_DIR = 'C:\ProgramData\chocolatey\lib\gnucobol\tools\config'
          if (-not (Get-Command cobc -ErrorAction SilentlyContinue)) {
            $env:PATH = "$env:PATH;C:\ProgramData\chocolatey\bin"
          }
          cargo test --locked -p bhf --no-fail-fast --test auto_cobol
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test portable scheduler runtime reliability
        run: cargo test --locked -p continuous_daemon --lib health::tests

      - name: Test native Windows runtime-event collector (#60)
        shell: pwsh
        env:
          BHF_WIN_LIVE: "1"
        run: |
          # Pure core + ETW consumer compile and unit tests.
          cargo test --locked -p bhf_collector_win --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Dependency-gated live ETW fixtures (ignored unless BHF_WIN_LIVE=1).
          cargo test --locked -p bhf_collector_win --test live_windows -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The ShellExecute positive and constant-command clean controls,
          # replayed under the sidecar by `bhf binary fuzz --collector auto`.
          cargo test --locked -p bhf --test collector_win_live -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows release artifacts
        run: cargo build --locked --release -p bhf -p bhf-daemon -p bhf_runtrace_shim -p bhf_collector_win --target x86_64-pc-windows-msvc

      - name: Exercise Windows release binaries
        shell: pwsh
        run: scripts/ci/windows-release-smoke.ps1 -BinaryDir target/x86_64-pc-windows-msvc/release

      - name: Build and install Windows component archives
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          irm https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.ps1 | iex
          dist build --artifacts=local --target=x86_64-pc-windows-msvc --output-format=json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dist build --artifacts=global --output-format=json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/fix-dist-powershell-installer.py target/distrib/bhf-installer.ps1 target/distrib/bhf-daemon-installer.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/component-install-smoke.py --artifacts target/distrib --evidence target/component-install-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain Windows component archives and installer evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bhf-windows-components
          path: |
            target/distrib/bhf*x86_64-pc-windows-msvc.zip*
            target/distrib/*installer.ps1
            target/component-install-windows/
          if-no-files-found: error
          retention-days: 7

      - name: Stage Windows release binaries
        shell: pwsh
        run: |
          Compress-Archive -Path `
            target\x86_64-pc-windows-msvc\release\bhf.exe, `
            target\x86_64-pc-windows-msvc\release\bhf-daemon.exe `
            -DestinationPath target\bhf-windows-release.zip

      - name: Upload Windows Server 2022 release binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bhf-windows-2022-release
          path: target/bhf-windows-release.zip
          if-no-files-found: error
          retention-days: 7

  windows-current-build:
    name: Windows Server 2025 release compatibility
    needs: windows-build
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Windows Server 2022 release binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bhf-windows-2022-release
          path: target/platform-release

      - name: Extract Windows release binaries
        shell: pwsh
        run: Expand-Archive target/platform-release/bhf-windows-release.zip target/platform-release/bin

      - name: Exercise Windows Server 2022 binaries on Windows Server 2025
        shell: pwsh
        run: scripts/ci/windows-release-smoke.ps1 -BinaryDir target/platform-release/bin

      - name: Download generated Windows component archives and installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bhf-windows-components
          path: target/component-release

      - name: Install Windows components on Server 2025
        shell: pwsh
        run: python scripts/ci/component-install-smoke.py --artifacts target/component-release --evidence target/component-install-windows-2025

      - name: Retain Windows Server 2025 component installer evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: component-install-windows-2025-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/component-install-windows-2025/
          if-no-files-found: error
          retention-days: 7

  ci-acceptance:
    # Make this the required check in branch protection. It is intentionally
    # not skipped when an upstream job fails or a documentation job is skipped.
    name: CI acceptance
    outputs:
      decision: ${{ steps.acceptance.outputs.decision }}
      commit: ${{ steps.acceptance.outputs.commit }}
      run_id: ${{ steps.acceptance.outputs.run_id }}
      run_attempt: ${{ steps.acceptance.outputs.run_attempt }}
    if: ${{ always() }}
    needs:
      - changes
      - ci-policy
      - doc-contracts
      - minimum-rust
      - build-test
      - arm64-build
      - macos-build
      - container-core
      - container-full
      - rhel7-build
      - rhel-family-smoke
      - ubuntu-release-smoke
      - arm64-release-build
      - windows-build
      - windows-current-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact evaluated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require complete successful CI or an explicit documentation exemption
        id: acceptance
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          REQUIRE_FULL_CI: ${{ inputs.force_full || github.ref_type == 'tag' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          full_args=()
          if [[ "$REQUIRE_FULL_CI" != false ]]; then full_args+=(--require-full); fi
          python3 scripts/ci/check-ci-acceptance.py \
            --commit "$GITHUB_SHA" --event "$EVENT_NAME" "${full_args[@]}" \
            --output ci-acceptance.json
          python3 - <<'PYTHON'
          import json, os, re
          with open("ci-acceptance.json", encoding="utf-8") as source:
              receipt = json.load(source)
          if (receipt.get("accepted") is not True
                  or receipt.get("commit") != os.environ["GITHUB_SHA"]
                  or receipt.get("decision") not in {"PASS_FULL_CI", "PASS_DOCS_ONLY"}):
              raise SystemExit("invalid CI acceptance export")
          for key in ("GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT"):
              if not re.fullmatch(r"[1-9][0-9]{0,19}", os.environ[key]):
                  raise SystemExit("invalid workflow run identity")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print("decision=" + receipt["decision"], file=output)
              print("commit=" + receipt["commit"], file=output)
              print("run_id=" + os.environ["GITHUB_RUN_ID"], file=output)
              print("run_attempt=" + os.environ["GITHUB_RUN_ATTEMPT"], file=output)
          PYTHON
      - name: Preserve acceptance or failure receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-acceptance.json
          if-no-files-found: error
          retention-days: 7
