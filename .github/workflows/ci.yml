# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  push:
    branches: [main, rtos-radar-fuzzing]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      force_full:
        description: Require every CI lane, even for documentation-only changes
        type: boolean
        default: false
    outputs:
      decision:
        description: Acceptance decision from this run
        value: ${{ jobs.ci-acceptance.outputs.decision }}
      commit:
        description: Exact evaluated commit
        value: ${{ jobs.ci-acceptance.outputs.commit }}
      run_id:
        description: Workflow run that produced the result
        value: ${{ jobs.ci-acceptance.outputs.run_id }}
      run_attempt:
        description: Workflow attempt that produced the result
        value: ${{ jobs.ci-acceptance.outputs.run_attempt }}


permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/classify-ci-scope.yml
    with:
      force_full: ${{ inputs.force_full || false }}

  ci-policy:
    name: CI policy regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test fail-closed CI policy and path classification
        run: python3 -m unittest discover -s scripts/ci/tests -v

  minimum-rust:
    name: Rust 1.88 source compatibility
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0

      - name: Check all workspace targets at the declared minimum
        run: cargo +1.88.0 check --locked --workspace --all-targets

  build-test:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: clippy

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Test VS Code extension
        run: |
          npm ci --prefix editors/vscode
          npm test --prefix editors/vscode

      - name: Test GNAT Studio plugin helpers
        run: python3 -m unittest discover -s editors/gnatstudio/tests

      - name: Test container validation contracts
        run: python3 -m unittest discover -s docker -p 'test_*.py'

      - name: Test offline signature verifier
        run: python3 -m unittest discover -s scripts/tests -p 'test_offline_verifier.py' -v

      - name: Build workspace
        run: cargo build --locked --workspace

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets

      - name: Test scheduler runtime reliability
        run: cargo test --locked -p continuous_daemon --lib

      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/0.9.146/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      # nextest runs all tests across every binary in one global parallel pool.
      # `cargo test` runs the ~290 test binaries one at a time, which took the
      # slow integration suites past the job timeout (58min+). nextest brings the
      # same suite to well under 10min. Doctests (which nextest does not run) are
      # covered by the dedicated `--doc` step below.
      - name: Test workspace (nextest)
        run: cargo nextest run --locked --workspace

      - name: Test doctests
        run: cargo test --locked --workspace --doc

      # `cargo build/test --workspace` compiles default features only, so every
      # `#[cfg(feature = ...)]` block is invisible to the steps above. That
      # matters most for `libafl-engine`: its crates are `optional = true`, so
      # they are not even fetched, and a dependency bump that breaks the
      # bindings would merge on a fully green CI run. Dependabot proposed
      # exactly that (libafl 0.13 -> 0.16, four compile errors behind the flag).
      #
      # `nyx-engine` currently reports NotImplemented until the real libnyx
      # integration lands; keep that feature compiling and its fallback tested.
      - name: Build and test optional features
        env:
          # probe_gnat_actions' build script rejects the `enabled` feature
          # outside these profiles, by design.
          BHF_PROFILE: external-tools
        run: |
          cargo build --locked -p fuzz_engine_libafl_adapter --features libafl-engine
          cargo test --locked -p fuzz_engine_libafl_adapter --features libafl-engine
          cargo test --locked -p fuzz_engine_nyx_adapter --features nyx-engine
          cargo test --locked -p probe_gnat_actions --features enabled

  rhel7-build:
    name: RHEL 7 compatible build
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RHEL7_BUILD_IMAGE: quay.io/pypa/manylinux2014_x86_64@sha256:0d25b049964b2549b83384036abdff06789a8c0b1e9ff003ec80f0d531f79e50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test on the RHEL 7 ABI
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/io" \
            --workdir /io \
            --env CARGO_HOME=/tmp/cargo \
            --env RUSTUP_HOME=/tmp/rustup \
            --env CARGO_TARGET_DIR=/io/target/rhel7 \
            "$RHEL7_BUILD_IMAGE" \
            bash -lc '
              set -euo pipefail
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              export PATH="$CARGO_HOME/bin:$PATH"
              test -x /opt/python/cp312-cp312/bin/python3
              export PATH="/opt/python/cp312-cp312/bin:$PATH"
              python3 --version
              bash scripts/ci/build-test-openssl.sh /tmp/bhf-ci-openssl
              export PATH="/tmp/bhf-ci-openssl/bin:$PATH"
              openssl version
              cargo test --locked -p continuous_daemon --lib
              cargo test --locked -p governance --lib
              cargo test --locked -p bhf --test offline_dist_scripts -- --nocapture
              cargo build --locked --release --workspace
              scripts/check-linux-release-abi.sh "$CARGO_TARGET_DIR/release"
              tar -C "$CARGO_TARGET_DIR/release" -czf /io/target/bhf-el7-release.tar.gz \
                bhf \
                bhf-daemon \
                libbhf_runtrace_shim.so \
                libbhf_cc_intercept.so
            '

      - name: Upload EL7-baseline release binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bhf-el7-release
          path: target/bhf-el7-release.tar.gz
          if-no-files-found: error

  rhel-family-smoke:
    name: ${{ matrix.name }} release compatibility
    needs: rhel7-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: RHEL 8.10 compatible
            image: almalinux:8.10@sha256:f043b7ac550015e1ed0b5a55a420c61d178bff4357ab9663fe0fbdcf1e6e2d86
          - name: RHEL 9.8 compatible
            image: almalinux:9.8@sha256:28db580abb508f7ccbc0ac6d53e1d8da9d42a26c77fa3dcc26ac2726673fbe3e
          - name: RHEL 10.2 compatible
            image: almalinux:10.2@sha256:689dc4a86e288b3f88ced4bf14bef18cdaf5539609608ca4cebc62720740dfa2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download EL7-baseline release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bhf-el7-release
          path: target/platform-release

      - name: Exercise release on ${{ matrix.name }}
        env:
          PLATFORM_IMAGE: ${{ matrix.image }}
        run: |
          tar -C target/platform-release -xzf target/platform-release/bhf-el7-release.tar.gz
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/io:ro" \
            --volume "$GITHUB_WORKSPACE/target/platform-release:/opt/bhf:ro" \
            "$PLATFORM_IMAGE" \
            bash -lc '
              set -euo pipefail
              cat /etc/redhat-release
              dnf -y install clang llvm make
              for artifact in \
                /opt/bhf/bhf \
                /opt/bhf/bhf-daemon \
                /opt/bhf/libbhf_runtrace_shim.so \
                /opt/bhf/libbhf_cc_intercept.so; do
                ldd "$artifact"
              done | tee /tmp/bhf-ldd.txt
              if grep -q "not found" /tmp/bhf-ldd.txt; then exit 1; fi
              /opt/bhf/bhf --version
              /opt/bhf/bhf-daemon --help >/dev/null
              /opt/bhf/bhf scan /io/tests/fixtures/engine_parity/magic_byte \
                --work-dir /tmp/bhf-scan
              /opt/bhf/bhf auto /io/tests/fixtures/engine_parity/magic_byte \
                --work-dir /tmp/bhf-plan \
                --languages c --list-targets --no-discovery-cache
              /opt/bhf/bhf auto /io/tests/fixtures/engine_parity/magic_byte \
                --work-dir /tmp/bhf-fuzz \
                --languages c --target parse_frame --iterations 32 --single-pass \
                --sanitizers none --per-target-time 5 --no-discovery-cache
              grep -Eq "\"built_and_fuzzed\"[[:space:]]*:[[:space:]]*1" \
                /tmp/bhf-fuzz/auto/run.json
              test -n "$(find /tmp/bhf-fuzz -name runtrace.jsonl -type f -size +0c -print -quit)"
            '

  ubuntu-release-smoke:
    name: Ubuntu ${{ matrix.version }} release compatibility
    needs: rhel7-build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "22.04 LTS"
            runner: ubuntu-22.04
          - version: "24.04 LTS"
            runner: ubuntu-24.04
          - version: "26.04 LTS"
            runner: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download EL7-baseline release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bhf-el7-release
          path: target/platform-release

      - name: Exercise release on Ubuntu ${{ matrix.version }}
        run: |
          tar -C target/platform-release -xzf target/platform-release/bhf-el7-release.tar.gz
          lsb_release -ds
          clang --version
          for artifact in \
            target/platform-release/bhf \
            target/platform-release/bhf-daemon \
            target/platform-release/libbhf_runtrace_shim.so \
            target/platform-release/libbhf_cc_intercept.so; do
            ldd "$artifact"
          done | tee target/platform-release/ldd.txt
          if grep -q "not found" target/platform-release/ldd.txt; then exit 1; fi
          target/platform-release/bhf --version
          target/platform-release/bhf-daemon --help >/dev/null
          target/platform-release/bhf scan tests/fixtures/engine_parity/magic_byte \
            --work-dir "$RUNNER_TEMP/bhf-scan"
          target/platform-release/bhf auto tests/fixtures/engine_parity/magic_byte \
            --work-dir "$RUNNER_TEMP/bhf-plan" \
            --languages c --list-targets --no-discovery-cache
          target/platform-release/bhf auto tests/fixtures/engine_parity/magic_byte \
            --work-dir "$RUNNER_TEMP/bhf-fuzz" \
            --languages c --target parse_frame --iterations 32 --single-pass \
            --sanitizers none --per-target-time 5 --no-discovery-cache
          grep -Eq '"built_and_fuzzed"[[:space:]]*:[[:space:]]*1' \
            "$RUNNER_TEMP/bhf-fuzz/auto/run.json"
          test -n "$(find "$RUNNER_TEMP/bhf-fuzz" -name runtrace.jsonl -type f -size +0c -print -quit)"

  windows-build:
    name: Windows MSVC build and tests
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      BHF_RELEASE_VERSION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Test Windows-specific logic and daemon
        shell: pwsh
        run: |
          cargo test --locked -p bhf-daemon --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p bhf --lib windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p bhf --lib vcxproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test portable scheduler runtime reliability
        run: cargo test --locked -p continuous_daemon --lib health::tests

      - name: Build Windows release artifacts
        run: cargo build --locked --release -p bhf -p bhf-daemon -p bhf_runtrace_shim --target x86_64-pc-windows-msvc

      - name: Exercise Windows release binaries
        shell: pwsh
        run: scripts/ci/windows-release-smoke.ps1 -BinaryDir target/x86_64-pc-windows-msvc/release

      - name: Stage Windows release binaries
        shell: pwsh
        run: |
          Compress-Archive -Path `
            target\x86_64-pc-windows-msvc\release\bhf.exe, `
            target\x86_64-pc-windows-msvc\release\bhf-daemon.exe `
            -DestinationPath target\bhf-windows-release.zip

      - name: Upload Windows Server 2022 release binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bhf-windows-2022-release
          path: target/bhf-windows-release.zip
          if-no-files-found: error

  windows-current-build:
    name: Windows Server 2025 release compatibility
    needs: windows-build
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Windows Server 2022 release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bhf-windows-2022-release
          path: target/platform-release

      - name: Extract Windows release binaries
        shell: pwsh
        run: Expand-Archive target/platform-release/bhf-windows-release.zip target/platform-release/bin

      - name: Exercise Windows Server 2022 binaries on Windows Server 2025
        shell: pwsh
        run: scripts/ci/windows-release-smoke.ps1 -BinaryDir target/platform-release/bin

  ci-acceptance:
    # Make this the required check in branch protection. It is intentionally
    # not skipped when an upstream job fails or a documentation job is skipped.
    name: CI acceptance
    outputs:
      decision: ${{ steps.acceptance.outputs.decision }}
      commit: ${{ steps.acceptance.outputs.commit }}
      run_id: ${{ steps.acceptance.outputs.run_id }}
      run_attempt: ${{ steps.acceptance.outputs.run_attempt }}
    if: ${{ always() }}
    needs:
      - changes
      - ci-policy
      - minimum-rust
      - build-test
      - rhel7-build
      - rhel-family-smoke
      - ubuntu-release-smoke
      - windows-build
      - windows-current-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact evaluated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require complete successful CI or an explicit documentation exemption
        id: acceptance
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          REQUIRE_FULL_CI: ${{ inputs.force_full || github.ref_type == 'tag' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          full_args=()
          if [[ "$REQUIRE_FULL_CI" != false ]]; then full_args+=(--require-full); fi
          python3 scripts/ci/check-ci-acceptance.py \
            --commit "$GITHUB_SHA" --event "$EVENT_NAME" "${full_args[@]}" \
            --output ci-acceptance.json
          python3 - <<'PYTHON'
          import json, os, re
          with open("ci-acceptance.json", encoding="utf-8") as source:
              receipt = json.load(source)
          if (receipt.get("accepted") is not True
                  or receipt.get("commit") != os.environ["GITHUB_SHA"]
                  or receipt.get("decision") not in {"PASS_FULL_CI", "PASS_DOCS_ONLY"}):
              raise SystemExit("invalid CI acceptance export")
          for key in ("GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT"):
              if not re.fullmatch(r"[1-9][0-9]{0,19}", os.environ[key]):
                  raise SystemExit("invalid workflow run identity")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print("decision=" + receipt["decision"], file=output)
              print("commit=" + receipt["commit"], file=output)
              print("run_id=" + os.environ["GITHUB_RUN_ID"], file=output)
              print("run_attempt=" + os.environ["GITHUB_RUN_ATTEMPT"], file=output)
          PYTHON
      - name: Preserve acceptance or failure receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-acceptance.json
          if-no-files-found: error
          retention-days: 30
