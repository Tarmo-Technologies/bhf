# Based on cargo-dist generation; preserve the reviewed release gate on regeneration.
# See docs/enterprise-release-controls.md and release workflow contract tests.
#
# Copyright 2022-2024, axodotdev
# SPDX-License-Identifier: MIT or Apache-2.0
#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release
permissions:
  contents: read

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

# Never cancel a publishing attempt midway through its side effects. This
# differs from the called CI workflow's ci-* group, avoiding self-cancellation.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A local reusable workflow resolves at the caller's exact commit. No
  # secrets are inherited and tests receive only a read-only repository token.
  validate-release-ci:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      force_full: true

  release-acceptance:
    name: Release CI acceptance
    needs: validate-release-ci
    if: ${{ always() && github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact-revision full CI from this run and attempt
        env:
          CI_VALIDATION_JSON: ${{ toJSON(needs.validate-release-ci) }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/ci/check-release-acceptance.py \
            --commit "$GITHUB_SHA" --event "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output release-ci-acceptance.json
      - name: Preserve release authorization or rejection receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-ci-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-ci-acceptance.json
          if-no-files-found: error
          retention-days: 90

  # Run 'dist plan' (or host) to determine what tasks we need to do
  release-plan:
    needs: release-acceptance
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && needs.release-acceptance.result == 'success' }}
    permissions:
      contents: write
    timeout-minutes: 15
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      - id: plan
        run: |
          set -euo pipefail
          dist host --steps=create --tag="$RELEASE_TAG" --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Run 'dist plan' (or host) to determine what tasks we need to do
  pull-request-plan:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    timeout-minutes: 15
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      - id: plan
        run: |
          set -euo pipefail
          dist plan --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Preserve downstream plan outputs while keeping PR planning read-only.
  plan:
    needs: [release-acceptance, release-plan, pull-request-plan]
    if: ${{ always() && ((github.event_name == 'pull_request' && needs.pull-request-plan.result == 'success') || (github.event_name == 'push' && github.ref_type == 'tag' && needs.release-acceptance.result == 'success' && needs.release-plan.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      val: ${{ needs.release-plan.outputs.val || needs.pull-request-plan.outputs.val }}
      tag: ${{ needs.release-plan.outputs.tag }}
      tag-flag: ${{ needs.release-plan.outputs.tag-flag }}
      publishing: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    steps:
      - name: Select only the successful event-specific plan
        run: echo 'The event-specific plan completed successfully.'

  # Build and packages all the platform-specific things
  build-local-artifacts:
    timeout-minutes: 90
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
      DIST_ARGS: ${{ matrix.dist_args }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      RHEL7_BUILD_IMAGE: quay.io/pypa/manylinux2014_x86_64@sha256:0d25b049964b2549b83384036abdff06789a8c0b1e9ff003ec80f0d531f79e50
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build Linux artifacts on the RHEL 7 ABI
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Build the Linux matrix entry against manylinux2014 / glibc 2.17
          # while JavaScript actions stay on the modern host runner.
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" \
            --env GH_TOKEN \
            --env DIST_ARGS \
            --env RELEASE_TAG \
            --env CARGO_HOME=/tmp/cargo \
            --env RUSTUP_HOME=/tmp/rustup \
            "$RHEL7_BUILD_IMAGE" \
            bash -lc '
              set -euo pipefail
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              export PATH="$CARGO_HOME/bin:$PATH"
              curl --proto "=https" --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh
              tag_args=()
              [[ -z "$RELEASE_TAG" ]] || tag_args+=("--tag=$RELEASE_TAG")
              dist build "${tag_args[@]}" --print=linkage --output-format=json $DIST_ARGS > dist-manifest.json
              release_dir=target/x86_64-unknown-linux-gnu/dist
              [[ -d $release_dir ]] || release_dir=target/dist
              scripts/check-linux-release-abi.sh "$release_dir"
            '
          echo "dist ran successfully"
      - id: linux-release-dir
        name: Locate raw Linux release binaries for protected signing job
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          release_dir=target/x86_64-unknown-linux-gnu/dist
          [[ -d "$release_dir" ]] || release_dir=target/dist
          test -x "$release_dir/bhf"
          test -x "$release_dir/bhf-daemon"
          echo "path=$release_dir" >> "$GITHUB_OUTPUT"
      - name: Transfer raw Linux binaries to protected signing job
        if: runner.os == 'Linux' && needs.plan.outputs.publishing == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-raw
          path: ${{ steps.linux-release-dir.outputs.path }}/
          if-no-files-found: error
      - name: Build Windows artifacts
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tag_args=()
          [[ -z "$RELEASE_TAG" ]] || tag_args+=("--tag=$RELEASE_TAG")
          dist build "${tag_args[@]}" --print=linkage --output-format=json $DIST_ARGS > dist-manifest.json
          echo "dist ran successfully"
      - name: Validate packaged harness runtimes (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          archive=target/distrib/bhf-x86_64-unknown-linux-gnu.tar.xz
          [[ -f "$archive" ]] || { echo "bhf Linux archive not found" >&2; exit 1; }
          entries=$(tar -tf "$archive")
          for marker in \
            ada_runtime/adafuzz.ads \
            c_runtime/bhf_driver.c \
            bhf-bug-report.sh \
            csharp_runtime/Driver.cs \
            java_runtime/build-agent.sh \
            js_runtime/bhf_driver.js \
            lua_runtime/bhf_driver.lua \
            perl_runtime/Devel/BhfCov.pm \
            php_runtime/bhf_driver.php \
            python_runtime/bhf_driver.py \
            ruby_runtime/bhf_driver.rb \
            rust_runtime/Cargo.toml
          do
            grep -Fq "$marker" <<<"$entries" || { echo "missing $marker from $archive" >&2; exit 1; }
          done
      - name: Validate install guide in every Linux component archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for archive in \
            target/distrib/bhf-x86_64-unknown-linux-gnu.tar.xz \
            target/distrib/bhf-daemon-x86_64-unknown-linux-gnu.tar.xz \
            target/distrib/bhf_runtrace_shim-x86_64-unknown-linux-gnu.tar.xz \
            target/distrib/bhf_cc_intercept-x86_64-unknown-linux-gnu.tar.xz
          do
            entries=$(tar -tf "$archive")
            grep -Eq '(^|/)INSTALL\.md$' <<<"$entries" || {
              echo "missing INSTALL.md from $archive" >&2
              exit 1
            }
          done
      - name: Validate packaged harness runtimes (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Get-Item target/distrib/bhf-x86_64-pc-windows-msvc.zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive.FullName)
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
            $markers = @(
              "ada_runtime/adafuzz.ads",
              "c_runtime/bhf_driver.c",
              "bhf-bug-report.sh",
              "csharp_runtime/Driver.cs",
              "java_runtime/build-agent.sh",
              "js_runtime/bhf_driver.js",
              "lua_runtime/bhf_driver.lua",
              "perl_runtime/Devel/BhfCov.pm",
              "php_runtime/bhf_driver.php",
              "python_runtime/bhf_driver.py",
              "ruby_runtime/bhf_driver.rb",
              "rust_runtime/Cargo.toml"
            )
            foreach ($marker in $markers) {
              if (-not ($entries | Where-Object { $_ -eq $marker -or $_.EndsWith("/$marker") })) {
                throw "missing $marker from $($archive.FullName)"
              }
            }
          } finally {
            $zip.Dispose()
          }
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Only tagged releases can enter the protected signing environment. PR jobs
  # still build their ordinary unsigned platform artifacts without secret access.
  sign-linux-bundle:
    timeout-minutes: 30
    needs:
      - release-acceptance
      - plan
      - build-local-artifacts
    if: ${{ needs.release-acceptance.result == 'success' && needs.plan.outputs.publishing == 'true' && needs.build-local-artifacts.result == 'success' }}
    runs-on: ubuntu-22.04
    environment: production-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download raw Linux release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-release-raw
          path: target/release-raw
      - name: Sign, verify, and exercise the complete Linux bundle
        shell: bash
        env:
          BHF_RELEASE_SIGNING_KEY_PKCS8_B64: ${{ secrets.BHF_RELEASE_SIGNING_KEY_PKCS8_B64 }}
          BHF_RELEASE_KEY_ID: ${{ vars.BHF_RELEASE_KEY_ID }}
          BHF_RELEASE_PUBLIC_KEY_HEX: ${{ vars.BHF_RELEASE_PUBLIC_KEY_HEX }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          [[ -n "$BHF_RELEASE_SIGNING_KEY_PKCS8_B64" ]] || { echo 'missing protected release signing key' >&2; exit 1; }
          [[ "$BHF_RELEASE_KEY_ID" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'missing or malformed release key ID' >&2; exit 1; }
          [[ "$BHF_RELEASE_PUBLIC_KEY_HEX" =~ ^[0-9a-f]{64}$ ]] || { echo 'missing or malformed release public key' >&2; exit 1; }
          signing_dir="$(mktemp -d "$RUNNER_TEMP/bhf-release-signing.XXXXXX")"
          trap 'rm -f -- "$signing_dir/private.der" "$signing_dir/public.hex" "$signing_dir/policy.json"; rmdir -- "$signing_dir"' EXIT
          umask 077
          printf '%s' "$BHF_RELEASE_SIGNING_KEY_PKCS8_B64" | base64 --decode > "$signing_dir/private.der"
          test -s "$signing_dir/private.der"
          printf '%s\n' "$BHF_RELEASE_PUBLIC_KEY_HEX" > "$signing_dir/public.hex"
          printf '{"schema_version":"bhf.policy.v1","policy_id":"release-smoke","update_packs":{"require_signature":true,"trusted_public_keys":{"%s":"%s"}}}\n' \
            "$BHF_RELEASE_KEY_ID" "$BHF_RELEASE_PUBLIC_KEY_HEX" > "$signing_dir/policy.json"

          chmod +x target/release-raw/bhf target/release-raw/bhf-daemon
          version="$RELEASE_TAG"
          safe_version="$(printf '%s' "$version" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          bundle_name="bhf-dist-${safe_version}-x86_64-unknown-linux-gnu"
          scripts/package-offline-dist.sh \
            --artifact-dir target/release-raw \
            --out target/distrib \
            --version "$version" \
            --target-triple x86_64-unknown-linux-gnu \
            --signing-key "$signing_dir/private.der" \
            --key-id "$BHF_RELEASE_KEY_ID" \
            --trusted-public-key "$signing_dir/public.hex"

          archive="target/distrib/${bundle_name}.tar.gz"
          signature="${archive}.sig"
          test -s "$archive"
          test "$(wc -c < "$signature")" -eq 64
          (cd target/distrib && sha256sum -c "${bundle_name}.tar.gz.sha256")
          (cd target/distrib && sha256sum -c "${bundle_name}.tar.gz.sig.sha256")
          bash scripts/verify-offline-dist.sh --archive "$archive" \
            --signature "$signature" --trusted-public-key "$signing_dir/public.hex"

          verify_root="$(mktemp -d)"
          install_root="$(mktemp -d)"
          # Extract only the independently authenticated private copy. The
          # original archive pathname is not reopened after this verification.
          verified_archive="$verify_root/${bundle_name}.tar.gz"
          python3 scripts/verify-offline-dist.py \
            --archive "$archive" --signature "$signature" \
            --trusted-public-key "$signing_dir/public.hex" \
            --verified-copy "$verified_archive" --json \
            > target/distrib/linux-bundle-verification.json
          tar -xzf "$verified_archive" -C "$verify_root"
          bundle_root="$verify_root/$bundle_name"
          test -x "$bundle_root/install.sh"
          for document in INSTALL.md LICENSE README.md RELEASE_NOTES.md; do
            test -f "$bundle_root/$document"
          done
          test -x "$bundle_root/tool/bhf"
          test -x "$bundle_root/tool/bhf-daemon"
          test -x "$bundle_root/tool/bhf-bug-report"
          test -f "$bundle_root/tool/libbhf_runtrace_shim.so"
          test -f "$bundle_root/tool/libbhf_cc_intercept.so"
          "$bundle_root/install.sh" \
            --non-interactive \
            --trust-policy "$signing_dir/policy.json" \
            --prefix "$install_root/prefix" \
            --bin-dir "$install_root/bin" \
            --languages c \
            --targets native \
            --fuzzers builtin \
            --extras none \
            --no-system-packages \
            --no-rustup \
            --no-symlink
          "$install_root/prefix/bhf" --version
          test -x "$install_root/prefix/bhf-bug-report"
          test -f "$install_root/prefix/libbhf_runtrace_shim.so"
          test -f "$install_root/prefix/libbhf_cc_intercept.so"
          test -f "$install_root/prefix/packs/bhf-content-${safe_version}/install.json"
      - name: Upload authenticated Linux bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-signed-linux-bundle
          path: |
            target/distrib/bhf-dist-*.tar.gz
            target/distrib/bhf-dist-*.tar.gz.sha256
            target/distrib/bhf-dist-*.tar.gz.sig
            target/distrib/bhf-dist-*.tar.gz.sig.sha256
            target/distrib/linux-bundle-verification.json
          if-no-files-found: error

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    timeout-minutes: 30
    needs:
      - plan
      - build-local-artifacts
      - sign-linux-bundle
    if: ${{ always() && needs.plan.result == 'success' && needs.build-local-artifacts.result == 'success' && (needs.plan.outputs.publishing != 'true' || needs.sign-linux-bundle.result == 'success') }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          set -euo pipefail
          tag_args=()
          [[ -z "$RELEASE_TAG" ]] || tag_args+=("--tag=$RELEASE_TAG")
          dist build "${tag_args[@]}" --output-format=json "--artifacts=global" > dist-manifest.json
          python3 scripts/augment-release-installer.py target/distrib/bhf-installer.sh
          python3 scripts/fix-dist-shell-installer.py \
            target/distrib/bhf-installer.sh \
            target/distrib/bhf-daemon-installer.sh \
            target/distrib/bhf_runtrace_shim-installer.sh \
            target/distrib/bhf_cc_intercept-installer.sh
          python3 scripts/fix-dist-library-installer.py \
            target/distrib/bhf_runtrace_shim-installer.sh \
            target/distrib/bhf_cc_intercept-installer.sh
          python3 scripts/fix-dist-powershell-installer.py \
            target/distrib/bhf-installer.ps1 \
            target/distrib/bhf-daemon-installer.ps1
          grep -Fq BHF_RHEL7_GUIDANCE_BEGIN target/distrib/bhf-installer.sh
          grep -Fq "need_cmd xz" target/distrib/bhf-installer.sh
          grep -Fq "need_cmd xz" target/distrib/bhf-daemon-installer.sh
          grep -Fq "need_cmd xz" target/distrib/bhf_runtrace_shim-installer.sh
          grep -Fq "need_cmd xz" target/distrib/bhf_cc_intercept-installer.sh
          grep -Fq "chmod +x \"\$_lib_install_temp/\$_lib_name\"" \
            target/distrib/bhf_runtrace_shim-installer.sh
          grep -Fq "chmod +x \"\$_lib_install_temp/\$_lib_name\"" \
            target/distrib/bhf_cc_intercept-installer.sh
          grep -Fq "\$ProgressPreference = \"SilentlyContinue\"" \
            target/distrib/bhf-installer.ps1
          grep -Fq "\$ProgressPreference = \"SilentlyContinue\"" \
            target/distrib/bhf-daemon-installer.ps1
          grep -Fq "Avoid console progress-buffer access" \
            target/distrib/bhf-installer.ps1
          grep -Fq "Avoid console progress-buffer access" \
            target/distrib/bhf-daemon-installer.ps1
          echo "dist ran successfully"

          for sidecar in target/distrib/bhf-dist-*.tar.gz.sha256 target/distrib/bhf-dist-*.tar.gz.sig.sha256; do
            [[ -f "$sidecar" ]] || continue
            cat "$sidecar" >> target/distrib/sha256.sum
          done
          LC_ALL=C sort -u -o target/distrib/sha256.sum target/distrib/sha256.sum

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Determines if we should publish/announce
  host:
    timeout-minutes: 30
    permissions:
      contents: write
    needs:
      - release-acceptance
      - plan
      - build-local-artifacts
      - sign-linux-bundle
      - build-global-artifacts
    # Publishing requires exact-revision full CI and all required build/sign jobs.
    if: ${{ always() && needs.release-acceptance.result == 'success' && github.event_name == 'push' && github.ref_type == 'tag' && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && needs.sign-linux-bundle.result == 'success' && needs.build-global-artifacts.result == 'success' && needs.build-local-artifacts.result == 'success' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          dist host "--tag=$RELEASE_TAG" --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt

          gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  announce:
    timeout-minutes: 5
    needs:
      - plan
      - host
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: recursive
