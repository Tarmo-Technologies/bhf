# SPDX-License-Identifier: Apache-2.0

# Emulator-in-the-loop (HIL-emu) validation lane.
#
# Runs the REAL (live-QEMU) transport validations — RV-1 (cross-endian fidelity),
# RV-2 (live gdb-remote), RV-3 (live full-system snapshot on emulated Cortex-M),
# RV-4 (pinned FreeRTOS task/queue, CLI finding and replay), RV-5 (the
# reference agent's Zephyr sample, CLI finding and replay), RV-7 (the Renode
# transport against a pinned Renode, library and CLI) —
# via scripts/hil-emu.sh. The script hard-fails if the qemu / cross toolchains are
# missing and runs the gated tests with BHF_HIL_REQUIRE=1, so the emulator
# validations CANNOT silently skip in CI. The physical-board lane
# (crates/target_transport/tests/hil_board.rs) is not run here (no hardware); see
# docs/hil-bringup.md.

name: HIL-emu

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "crates/target_transport/**"
      - "crates/event_log/**"
      - "crates/cli/src/auto/cross_target.rs"
      - "crates/cli/src/transport_*.rs"
      - "crates/cli/src/fuzz.rs"
      - "crates/cli/tests/transport_fuzz_qemu_cli.rs"
      - "crates/cli/tests/transport_freertos_agent_cli.rs"
      - "c_runtime/bhf_agent.*"
      - "c_runtime/zephyr/**"
      - "crates/cli/tests/transport_zephyr_agent_cli.rs"
      - "scripts/ci/install-zephyr.sh"
      - "crates/cli/tests/transport_fuzz_renode_cli.rs"
      - "scripts/ci/install-renode.sh"
      - "scripts/ci/fetch.sh"
      - "scripts/hil-emu.sh"
      - ".github/workflows/hil-emu.yml"
  schedule:
    # Nightly, so a toolchain/qemu regression surfaces even without a code change.
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hil-emu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hil-emu:
    name: Live-QEMU transport validation (RV-1/RV-2/RV-3/RV-4)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install QEMU + cross toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-user \
            qemu-system-arm \
            qemu-utils \
            gcc-arm-none-eabi \
            libnewlib-dev \
            libnewlib-arm-none-eabi \
            gcc-arm-linux-gnueabihf \
            gcc-powerpc64-linux-gnu \
            libc6-dev-armhf-cross \
            libc6-dev-ppc64-cross \
            binutils \
            build-essential \
            clang \
            device-tree-compiler \
            gperf \
            git
          # Sanity: the exact binaries scripts/hil-emu.sh requires.
          for tool in qemu-arm qemu-ppc64 qemu-system-arm qemu-img \
                      arm-none-eabi-gcc arm-linux-gnueabihf-gcc powerpc64-linux-gnu-gcc nm cc git \
                      clang; do
            command -v "$tool" >/dev/null || { echo "missing $tool after install" >&2; exit 1; }
          done

      # The components rust-toolchain.toml lists, installed with the toolchain:
      # a later `cargo` adding them hit a conflict with a runner image's own
      # stable install (#423).
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      # The Zephyr agent sample (RV-5) builds against a Zephyr tree with west.
      - name: Cache the Zephyr tree
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/opt/zephyrproject
          key: zephyr-${{ runner.os }}-${{ hashFiles('scripts/ci/install-zephyr.sh') }}

      - name: Install Zephyr and west
        run: |
          bash scripts/ci/install-zephyr.sh >> "$GITHUB_ENV"
          echo "$HOME/.local/opt/zephyrproject/.venv/bin" >> "$GITHUB_PATH"

      # The Renode transport's live tests (RV-7) run against this pinned
      # portable Renode; the script puts BHF_RENODE in the environment.
      - name: Install Renode
        run: bash scripts/ci/install-renode.sh "$HOME/.local/opt/renode-ci" >> "$GITHUB_ENV"

      - name: Run the emulator-in-the-loop validations
        run: scripts/hil-emu.sh
