# SPDX-License-Identifier: Apache-2.0
#
# Scheduled scan of the release container images against the current
# vulnerability database. Pull request and branch CI only report image
# blockers (scripts/ci/review-image-scan.py), so that a CVE published upstream
# does not fail unrelated changes; tag, release and container-release runs
# still fail on them. This scan is where new blockers surface between
# releases: when it finds any, it opens one tracking issue, or updates the
# open one, and comments on it when the blocker list changes.
name: Container image scan

on:
  schedule:
    - cron: "43 4 * * *" # daily, 04:43 UTC
  workflow_dispatch:
    inputs:
      seed_blocker:
        description: Add a synthetic blocker to each scan, to check that the tracking issue opens and a second run updates it
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: image-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    name: Scan the ${{ matrix.image }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: core
            flavor: core
          - image: ada
            flavor: ada
          # The default build is the all-language runtime image, as in CI.
          - image: full
            flavor: ""
    env:
      IMAGE: ${{ matrix.image }}
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/image-scan-$IMAGE"
          mkdir -p "$evidence"
          flavor=()
          if [ -n "$FLAVOR" ]; then flavor=(--flavor "$FLAVOR"); fi
          bash scripts/build-container-release.sh "bhf:scan-$IMAGE" "${flavor[@]}" > "$evidence/build.log" 2>&1 \
            || { tail -100 "$evidence/build.log"; exit 1; }

      - name: Inventory and scan the image
        run: bash scripts/ci/inventory-image.sh "bhf:scan-$IMAGE" "$RUNNER_TEMP/image-scan-$IMAGE"

      - name: Seed a synthetic blocker
        if: ${{ inputs.seed_blocker }}
        run: python3 scripts/ci/image-scan-issue.py seed "$RUNNER_TEMP/image-scan-$IMAGE"

      # Report-only: the blockers go to the tracking issue below instead of
      # failing this job, which fails only when the scan itself could not run.
      - name: Review the scan
        run: python3 scripts/ci/review-image-scan.py --mode report-only "$RUNNER_TEMP/image-scan-$IMAGE"

      - name: Retain the review
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-scan-${{ matrix.image }}
          path: |
            ${{ runner.temp }}/image-scan-${{ matrix.image }}/release-review.json
            ${{ runner.temp }}/image-scan-${{ matrix.image }}/inventory-summary.json
            ${{ runner.temp }}/image-scan-${{ matrix.image }}/grype.json
          if-no-files-found: warn
          retention-days: 30

  track:
    name: Open or update the tracking issue
    needs: scan
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the reviews
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-scan-*
          path: ${{ runner.temp }}/reviews

      - name: Summarize the blockers
        id: render
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          reviews=("$RUNNER_TEMP"/reviews/image-scan-*/release-review.json)
          if [ "${#reviews[@]}" -eq 0 ]; then
            echo "no image was reviewed" >&2
            exit 1
          fi
          python3 scripts/ci/image-scan-issue.py render --run-url "$RUN_URL" \
            --body "$RUNNER_TEMP/issue-body.md" --comment "$RUNNER_TEMP/issue-comment.md" "${reviews[@]}"

      - name: Open or update the tracking issue
        if: ${{ steps.render.outputs.blockers != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          FINGERPRINT: ${{ steps.render.outputs.fingerprint }}
        run: |
          python3 scripts/ci/tracking-issue.py --repo "$GITHUB_REPOSITORY" \
            --key container-image-scan --label image-scan \
            --title "Container image scan: blockers in the release images" \
            --body-file "$RUNNER_TEMP/issue-body.md" --fingerprint "$FINGERPRINT" \
            --comment-file "$RUNNER_TEMP/issue-comment.md"

      # Blockers alone do not fail this workflow; an image that could not be
      # built or scanned does, after the others were tracked.
      - name: Require every image to have been scanned
        env:
          SCAN_RESULT: ${{ needs.scan.result }}
        run: test "$SCAN_RESULT" = success
