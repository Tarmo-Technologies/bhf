# SPDX-License-Identifier: Apache-2.0

name: Classify CI Scope

on:
  workflow_call:
    outputs:
      heavy:
        description: Whether a path requiring heavy CI changed
        value: ${{ jobs.classify.outputs.heavy }}

permissions:
  contents: read

jobs:
  classify:
    name: Classify CI scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test path classifier
        shell: bash
        run: |
          set -euo pipefail
          test "$(scripts/ci/should-run-heavy-ci.sh README.md CHANGELOG.md docs/site/install.md)" = false
          test "$(scripts/ci/should-run-heavy-ci.sh scripts/docs/build-site.py docs/site/install.md)" = false
          test "$(scripts/ci/should-run-heavy-ci.sh README.md Cargo.toml)" = true
          test "$(scripts/ci/should-run-heavy-ci.sh .github/workflows/ci.yml)" = true
          test "$(scripts/ci/should-run-heavy-ci.sh)" = true

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "Manual acceptance runs always execute full CI." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] ||
            ! git cat-file -e "${BASE_SHA}^{commit}" ||
            ! git cat-file -e "${HEAD_SHA}^{commit}"; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "Unable to resolve a complete comparison; running full CI." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # A process-substitution failure is not propagated by mapfile.
          # Capture the diff first; never classify a partial path list.
          paths_file="$(mktemp)"
          trap 'rm -f "$paths_file"' EXIT
          comparison="${BASE_SHA}..${HEAD_SHA}"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            comparison="${BASE_SHA}...${HEAD_SHA}"
          fi
          if ! git diff --name-only --no-renames -z "$comparison" > "$paths_file"; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "Path comparison failed; running full CI." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mapfile -d '' changed_files < "$paths_file"

          heavy="$(scripts/ci/should-run-heavy-ci.sh "${changed_files[@]}")"
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"

          if [[ "$heavy" == true ]]; then
            echo "A code, build, packaging, installer, or CI path changed; running heavy CI jobs." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Only documentation or repository text/template paths changed; skipping heavy CI jobs." >> "$GITHUB_STEP_SUMMARY"
          fi
