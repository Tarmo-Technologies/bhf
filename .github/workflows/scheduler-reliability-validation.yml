# SPDX-License-Identifier: Apache-2.0
name: Scheduler reliability validation
on:
  push:
    branches: [maintenance/enterprise-scheduler-566435]
permissions:
  contents: read
jobs:
  legacy-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect only the pinned image tool locations
        run: |
          set -euo pipefail
          docker run --rm quay.io/pypa/manylinux2014_x86_64@sha256:0d25b049964b2549b83384036abdff06789a8c0b1e9ff003ec80f0d531f79e50 \
            bash -lc '
              set -euo pipefail
              openssl version
              ls -ld /opt/_internal/openssl* /usr/local/ssl* 2>/dev/null || true
              find /opt /usr/local -type f -name openssl -print
              for candidate in /opt/_internal/openssl*/bin/openssl /usr/local/bin/openssl /usr/local/ssl/bin/openssl; do
                if [[ -x "$candidate" ]]; then
                  printf "CANDIDATE: %s\n" "$candidate"
                  "$candidate" version
                fi
              done
            ' 2>&1 | tee el7-tools.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: el7-tools
          path: el7-tools.log
          if-no-files-found: error
          retention-days: 14
