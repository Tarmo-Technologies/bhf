# SPDX-License-Identifier: Apache-2.0
#
# Nightly heavy integration suite: the ~110 bhf tests that each compile a
# C/C++/Ada target and run a fuzz campaign. Together they are ~40min of work, too
# heavy for every PR, so the per-PR `build-test` job runs only a language smoke
# subset and the full suite runs here nightly, sharded so each leg stays under
# 20min.
name: Integration (nightly)

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skip the nightly when the code hasn't changed: if the tip commit is older
  # than a day there were no new commits since the last nightly. A manual
  # dispatch always runs.
  gate:
    name: Gate on new commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect commits in the last day
        id: check
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "manual dispatch: running"
            exit 0
          fi
          head_ts="$(git log -1 --format=%ct)"
          now="$(date +%s)"
          age=$(( now - head_ts ))
          # 25h window covers the daily cron plus scheduler jitter.
          if [ "$age" -lt 90000 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "tip commit is ${age}s old (< 25h): running"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "tip commit is ${age}s old (>= 25h): no new code, skipping"
          fi

  integration:
    name: Integration tests (bhf)
    needs: gate
    if: needs.gate.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    # Generous: the heavy compile+fuzz tests are slow on CI's shared vCPUs and the
    # hash split balances test COUNT, not duration, so one shard can draw more of
    # the slow tests. 6 shards keeps the makespan down; the timeout guarantees
    # completion even for the heaviest shard. This is a non-blocking nightly.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/0.9.146/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      # RAYON_NUM_THREADS=1 keeps each bhf invocation's Rust work single-threaded;
      # the heavy-bhf concurrency cap (.config/nextest.toml) limits concurrent
      # compile+fuzz tests so the C compiler doesn't thrash the runner.
      # `--partition hash:N/6` splits the bhf integration tests across 6 shards.
      # --no-fail-fast matches `cargo test`.
      - name: Integration tests (shard ${{ matrix.shard }}/6)
        env:
          RAYON_NUM_THREADS: "1"
        run: cargo nextest run --locked --workspace --no-fail-fast -E 'package(bhf) & kind(test)' --partition hash:${{ matrix.shard }}/6
