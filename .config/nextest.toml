# SPDX-License-Identifier: Apache-2.0
#
# The heavy bhf integration tests each launch bhf to compile a C/C++/Ada target
# and run a short fuzz campaign. Compilation is CPU-heavy and the C compiler is
# not governed by RAYON_NUM_THREADS, so running many of these at once (nextest's
# default = one per core) oversubscribes the CPUs and each balloons to minutes.
# Cap how many run concurrently so each gets enough of the machine; the light
# unit tests are unaffected (they are excluded from build-test's fast lane and
# this group only matches bhf integration tests).
[test-groups]
heavy-bhf = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'package(bhf) & kind(test)'
test-group = 'heavy-bhf'

# CI runs (ci.yml, integration-nightly.yml) use `--profile ci`:
#  - a failing test is retried once; one that then passes is reported FLAKY,
#    which scripts/ci/junit-summary.py lists in the job summary;
#  - a test still running after 10 minutes (5 periods of 120s) is killed and
#    reported as a TIMEOUT failure, so a hang names itself instead of using up
#    the job's timeout: a hang and its retry take 20 minutes, which leaves a
#    40-minute nightly shard time for its other tests and the report. The
#    slowest regular test takes about 5.5 minutes on a runner;
#  - the JUnit report (target/nextest/ci/junit.xml, uploaded by each job)
#    keeps every test's captured stdout and stderr, passing tests included.
# Overrides of the default profile, such as the heavy-bhf group, apply here too.
[profile.ci]
retries = 1
slow-timeout = { period = "120s", terminate-after = 5 }
fail-fast = false
failure-output = "immediate-final"
# The nightly builds one archive (`cargo nextest archive --profile ci`) that
# every shard runs from. bhf loads the runtrace shim and the compiler intercept
# from beside itself, cdylibs no test binary links, and the heavy tests run the
# release bhf (BHF_TEST_BIN), so the archive carries them too.
archive.include = [
    { path = "debug/libbhf_runtrace_shim.so", relative-to = "target", on-missing = "error" },
    { path = "debug/libbhf_cc_intercept.so", relative-to = "target", on-missing = "error" },
    { path = "release/bhf", relative-to = "target", on-missing = "error" },
    { path = "release/libbhf_runtrace_shim.so", relative-to = "target", on-missing = "error" },
]

[profile.ci.junit]
path = "junit.xml"
store-success-output = true
store-failure-output = true

# build_recovery_scenarios runs a dozen build-recovery fixtures in sequence
# and takes 16-21 minutes in CI; it runs alone in a shard with a 55-minute
# timeout, so it gets 50 minutes, and no retry, which would not fit.
[[profile.ci.overrides]]
filter = 'binary(=build_recovery) & test(=build_recovery_scenarios)'
slow-timeout = { period = "300s", terminate-after = 10 }
retries = 0

# The nightly's `ignored` shard runs the long cold-solve discriminators (the
# RedQueen one takes about 13 minutes on a runner): 25 minutes each, and no
# retry, which would not fit in the shard's 40.
[[profile.ci.overrides]]
filter = 'binary(=auto_lua_hook) | binary(=redqueen_cmplog) | binary(=engine_parity)'
slow-timeout = { period = "300s", terminate-after = 5 }
retries = 0

# The release-build extension tests in build-test, kept in a report of their own.
[profile.ci-release]
inherits = "ci"
